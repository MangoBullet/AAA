<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chibi Style Responsive Layout</title>
    <link rel="stylesheet" href="../css/style.css"> <!-- เชื่อมโยงไฟล์ CSS -->
    <style>
        /* เพิ่ม CSS ที่นี่เพื่อควบคุมบล็อก */
        .image-container {
            display: flex;
            justify-content: space-between;
            gap: 10px; /* ช่องว่างระหว่างบล็อก */
            padding: 10px;
        }

        .block {
            flex: 1;
            text-align: center;
            border: 1px solid #ccc;
            padding: 10px;
        }

        img {
            width: 50%;
            height: 50%; /* กำหนดความสูงเท่ากันสำหรับทุกภาพ */
            object-fit: cover; /* ทำให้รูปภาพถูกครอบให้พอดีกับกรอบ */
        }
    </style>
</head>

                <option value="model/westbu.html">Model</option>
                <option value="model/indexart.html">Art toy</option>
            </select>
        </nav>
        <article>
            <h2>(Article)</h2>
            <p>เนื้อหา</p>
            <div class="image-container">
                <!-- บล็อกที่ 1
